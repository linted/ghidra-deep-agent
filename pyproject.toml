[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_deep_agent"]

[project]
name = "ghidra-deep-agent"
version = "0.1.0"
description = "A reverse engineering deep agent with Ghidra integration via MCP"
readme = "README.md"
requires-python = ">=3.13"
# Floors match the versions in uv.lock: `uv sync` resolves from the lock, but a
# plain `pip install .` has only these to go on, and the LangChain 1.x stack
# moves fast enough that an unconstrained resolve is not safe.
dependencies = [
    # <0.8: compaction.py drives private summarization-engine methods (see
    # compact_out_of_band); revisit the pin alongside the private-API smoke
    # test in tests/test_compaction.py on upgrade.
    "deepagents>=0.7.0,<0.8",
    "jsonschema>=4.26.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-mongodb>=0.11.0",
    "langchain[anthropic]>=1.3.14",
    "langchain-deepseek>=1.1.0",
    "langchain-nvidia-openshell>=0.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.6",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "openshell>=0.0.90",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
]

[project.scripts]
ghidra-deep-agent = "ghidra_deep_agent.cli:run"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.22",
    "mypy>=2.3.0",
]

[tool.uv]
# langchain-nvidia-openshell pins deepagents>=0.5,<0.6, but this project uses
# 0.7.x. Override the pin so uv resolves the shared 0.7.x deepagents; the
# adapter's use of the sandbox backend API is verified against 0.7.x separately.
override-dependencies = ["deepagents>=0.7,<0.8"]

[tool.ruff]
target-version = "py312"
exclude = ["agent_output*"]

[tool.ruff.lint]
# B (flake8-bugbear) catches real defects — notably B023, closures capturing a
# loop variable. Not BLE (blind-except): the broad `except Exception` handlers
# here are deliberate ("a sync hiccup must not kill the turn") and each carries
# a comment saying why, so enabling it would only add ~14 noqa lines.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B010's rewrite (setattr -> plain method assignment for monkeypatched TUI
# methods) is exactly what mypy --strict's method-assign check rejects.
"tests/test_tui.py" = ["B010"]
# These modules are almost entirely an embedded Java GhidraScript held as a
# string; their lines follow Java conventions, not Python's 88-col limit.
"src/ghidra_deep_agent/recover_prototypes_script.py" = ["E501"]
"src/ghidra_deep_agent/find_unrecovered_switches_script.py" = ["E501"]
"src/ghidra_deep_agent/apply_switch_override_script.py" = ["E501"]
"src/ghidra_deep_agent/ollvm_deobfuscate_script.py" = ["E501"]

[tool.pytest.ini_options]
# Scoping collection to `tests/` is what keeps it out of everything else at the
# repo root — agent run artifacts (`agent_output*`, `external_analysis/`), which
# contain .py files, and `.claude/worktrees/**`, which holds a full copy of the
# suite per active worktree. That previously needed a hand-maintained
# `norecursedirs` restating pytest's own defaults, since setting it replaces
# them rather than extending them.
testpaths = ["tests"]
markers = [
    "integration: needs live services (MongoDB with vector search, an embedding model)",
]
filterwarnings = [
    "default",
    # langchain_core imports pydantic.v1 shims; noisy on Python 3.14 and not ours to fix.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["agent_output"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
