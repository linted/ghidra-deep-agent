[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_deep_agent"]

[project]
name = "ghidra-deep-agent"
version = "0.1.0"
description = "A reverse engineering deep agent with Ghidra integration via MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "jsonschema",
    "langchain-mcp-adapters",
    "langchain-mongodb",
    "langchain[anthropic]",
    "langchain-deepseek",
    "langchain-nvidia-openshell",
    "langchain-ollama",
    "langchain-openrouter",
    "langgraph",
    "langgraph-checkpoint-mongodb",
    "openshell",
    "pymongo",
    "python-dotenv",
    "textual",
]

[project.scripts]
ghidra-deep-agent = "main:run"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.uv]
# langchain-nvidia-openshell pins deepagents>=0.5,<0.6, but this project uses
# 0.6.x. Override the pin so uv resolves the shared 0.6.x deepagents; the
# adapter's use of the sandbox backend API is verified against 0.6.x separately.
override-dependencies = ["deepagents>=0.6,<0.7"]

[tool.ruff]
target-version = "py312"
exclude = ["agent_output*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# These modules are almost entirely an embedded Java GhidraScript held as a
# string; their lines follow Java conventions, not Python's 88-col limit.
"src/ghidra_deep_agent/recover_prototypes_script.py" = ["E501"]
"src/ghidra_deep_agent/find_unrecovered_switches_script.py" = ["E501"]
"src/ghidra_deep_agent/apply_switch_override_script.py" = ["E501"]
"src/ghidra_deep_agent/ollvm_deobfuscate_script.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
# Agent run artifacts live at the repo root and can contain .py files; keep them
# out of collection (the default norecursedirs already covers dot-dirs/.venv).
norecursedirs = ["agent_output*", "external_analysis", "mongodb", "scripts"]
markers = [
    "integration: needs live services (MongoDB with vector search, an embedding model)",
]
filterwarnings = [
    "default",
    # langchain_core imports pydantic.v1 shims; noisy on Python 3.14 and not ours to fix.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["agent_output"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
